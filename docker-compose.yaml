secrets:
  db_password:
    environment: DB_PWD
  hf_token:
    environment: HF_TOKEN
  qdrant_api_key:
    environment: QDRANT_API_KEY

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    ports:
      - "1212:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PWD}
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - geo_net

  qdrant:
    image: qdrant/qdrant:v1.12.1
    restart: unless-stopped
    ports:
      - "1313:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - geo_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-cpu
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "${PORT}:1414"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      INIT_EMBEDDINGS: ${INIT_EMBEDDINGS:-true}
      DEVICE: ${DEVICE:-cpu}
      SEVEN_ZIP_BIN: /usr/bin/7z
      HOST: 0.0.0.0
    secrets:
      - db_password
      - hf_token

    volumes:
      - ./datasets:/app/datasets
      - app_logs:/app/logs
      - app_checkpoints:/app/emb_fit/checkpoints
    networks:
      - geo_net

volumes:
  pgdata:
  qdrant_data:
  app_logs:
  app_checkpoints:

networks:
  geo_net:
    driver: bridge
