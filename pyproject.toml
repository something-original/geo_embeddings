[project]
name = "geo-embeddings"
version = "0.1.0"
description = ""
authors = [
    {name = "Georgiy Kiselev", email = "gsx2002@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"

dependencies = [
    "catboost (>=1.2.8,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "scikit-learn (==1.6.1)",
    "category-encoders (>=2.9.0,<3.0.0)",
    "geopy (>=2.4.1,<3.0.0)",
    "numpy (==1.26.4)",
    "pytorch-widedeep (>=1.7.0,<2.0.0)",
    "tabpfn (>=6.0.6,<7.0.0)",
    "tabpfn-extensions (>=0.2.1,<0.3.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "pyproj (>=3.7.2,<4.0.0)",
    "contextily (>=1.6.2,<2.0.0)",
    "Pillow (>=10.0.0,<11.0.0)",
    "transformers (>=4.30.0,<5.0.0)",
    "lightning (>=2.0.0,<3.0.0)",
    "timm (>=0.9.0,<1.0.0)",
    "torchgeo (>=0.5.0,<1.0.0)",
    "rasterio (>=1.3.0,<2.0.0)",
    "albumentations (>=1.3.0,<2.0.0)",
    "einops (>=0.7.0,<1.0.0)",
    "sympy (>=1.12.0,<2.0.0)",
    "srai (==0.10.2)",
    "wget (>=3.2,<4.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "fastzipfile (>=2.3.1,<3.0.0)",
    "polars (>=1.39.3,<2.0.0)",
    "certifi (>=2026.2.25,<2027.0.0)",
    "optuna (>=4.8.0,<5.0.0)",
    "optuna-integration[pytorch-lightning] (>=4.8.0,<5.0.0)",
    "kaggle (>=2.1.0,<3.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "python-multipart (>=0.0.9,<1.0.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "qdrant-client (==1.12.1)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "geopandas (>=1.0.0,<2.0.0)",
    "torch-geometric (>=2.7.0,<3.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"

[tool.poetry.group.cpu.dependencies]
torch = { version = ">=2.9.0,<3.0.0", source = "pytorch-cpu" }
torchvision = { version = ">=0.20.0,<1.0.0", source = "pytorch-cpu" }

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"